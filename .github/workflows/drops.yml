name: Проверка бесплатных игр Epic

on:
  schedule:
    - cron: '0 7 * * *'  # Запуск каждый день в 10:00 по Москве (7:00 UTC)
  workflow_dispatch:     # Позволяет запустить вручную для проверки

jobs:
  check-games:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4
      
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Установить библиотеки
        run: pip install requests
      
      - name: Запустить бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python drops_bot.py
