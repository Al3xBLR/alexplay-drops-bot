name: Проверка бесплатных игр Epic

on:
  schedule:
    - cron: '0 7 * * *'  # Каждый день в 10:00 по Москве
  workflow_dispatch:     # Для ручного запуска

jobs:
  check-games:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4
      
      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Установить библиотеки
        run: pip install requests
      
      - name: Запустить бота
        env:
          # ВАЖНО: Эти строки передают секреты из настроек GitHub в скрипт Python
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DROPS_CHANNEL_ID: ${{ secrets.DROPS_CHANNEL_ID }}
          HUB_CHANNEL_ID: ${{ secrets.HUB_CHANNEL_ID }}
        run: python drops_bot.py
